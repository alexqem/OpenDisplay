name: OpenDisplay CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: Build & Test (macOS Apple Silicon)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Show Swift & Xcode Version
        run: |
          swift --version
          xcodebuild -version

      - name: Run Test Suite (Phases 1-13)
        working-directory: OpenDisplay
        run: swift test -v

      - name: Build Debug Binary
        working-directory: OpenDisplay
        run: swift build -v

      - name: Build Release Binary
        working-directory: OpenDisplay
        run: swift build -c release -v

      - name: Assemble OpenDisplay.app Bundle
        run: |
          mkdir -p build/OpenDisplay.app/Contents/MacOS
          mkdir -p build/OpenDisplay.app/Contents/Resources
          
          # Copy release executables
          cp OpenDisplay/.build/release/OpenDisplay build/OpenDisplay.app/Contents/MacOS/OpenDisplay
          cp OpenDisplay/.build/release/opendisplay build/OpenDisplay.app/Contents/MacOS/opendisplay
          chmod +x build/OpenDisplay.app/Contents/MacOS/OpenDisplay
          chmod +x build/OpenDisplay.app/Contents/MacOS/opendisplay

          # Create Info.plist for menu bar app
          cat << 'EOF' > build/OpenDisplay.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>OpenDisplay</string>
              <key>CFBundleIdentifier</key>
              <string>org.opendisplay.app</string>
              <key>CFBundleName</key>
              <string>OpenDisplay</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.4.0</string>
              <key>CFBundleVersion</key>
              <string>1.4.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>12.0</string>
              <key>LSUIElement</key>
              <true/>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSPrincipalClass</key>
              <string>NSApplication</string>
          </dict>
          </plist>
          EOF

          # Ad-hoc codesign every binary and the app bundle (mandatory for ARM64 macOS)
          codesign --force --deep -s - build/OpenDisplay.app/Contents/MacOS/opendisplay
          codesign --force --deep -s - build/OpenDisplay.app/Contents/MacOS/OpenDisplay
          codesign --force --deep -s - build/OpenDisplay.app

          # Verify signature
          codesign -vvv --deep --strict build/OpenDisplay.app

          # Create release zip archive preserving symlinks, execution bits, and xattrs
          cd build
          ditto -c -k --keepParent OpenDisplay.app OpenDisplay-macOS-arm64.zip
          
          # Also package as DMG for native drag-and-drop mounting
          hdiutil create -volname "OpenDisplay" -srcfolder OpenDisplay.app -ov -format UDZO OpenDisplay-macOS-arm64.dmg


      - name: Upload OpenDisplay Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenDisplay-macOS-arm64
          path: |
            build/OpenDisplay-macOS-arm64.zip
            build/OpenDisplay-macOS-arm64.dmg
          retention-days: 30


